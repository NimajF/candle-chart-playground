<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved app theme before first paint to avoid a dark flash
      try {
        const saved = localStorage.getItem('candle-theme-playground:app-theme');
        const theme =
          saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <title>Candle Theme Playground</title>
    <meta
      name="description"
      content="Design color themes for candlestick charts. Tweak candle, wick and background colors live, randomize, save presets and copy them into your project."
    />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />

    <link rel="canonical" href="https://candle-chart-playground.vercel.app/app" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://candle-chart-playground.vercel.app/app" />
    <meta property="og:site_name" content="Candle Theme Playground" />
    <meta property="og:title" content="Candle Theme Playground" />
    <meta
      property="og:description"
      content="Design color themes for candlestick charts and copy them into your project."
    />
    <meta property="og:image" content="https://candle-chart-playground.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Candle Theme Playground: a candlestick chart next to a color theme editor"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Candle Theme Playground" />
    <meta
      name="twitter:description"
      content="Design color themes for candlestick charts and copy them into your project."
    />
    <meta name="twitter:image" content="https://candle-chart-playground.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Candle Theme Playground needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
